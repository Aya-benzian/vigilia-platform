global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: vigilia

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Spring Boot services — metrics at /actuator/prometheus
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]
    metrics_path: /actuator/prometheus

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8081"]
    metrics_path: /actuator/prometheus

  - job_name: customer-service
    static_configs:
      - targets: ["customer-service:8082"]
    metrics_path: /actuator/prometheus

  - job_name: transaction-service
    static_configs:
      - targets: ["transaction-service:8083"]
    metrics_path: /actuator/prometheus

  - job_name: risk-management-service
    static_configs:
      - targets: ["risk-management-service:8084"]
    metrics_path: /actuator/prometheus

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8085"]
    metrics_path: /actuator/prometheus

  - job_name: audit-service
    static_configs:
      - targets: ["audit-service:8086"]
    metrics_path: /actuator/prometheus

  # FastAPI ML service — metrics at /metrics
  - job_name: ml-serving
    static_configs:
      - targets: ["ml-serving:8000"]
    metrics_path: /metrics
