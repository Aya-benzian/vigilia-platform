global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default

receivers:
  - name: default
    # Configure email, Slack, or webhook notifications here.
    # Example (Slack):
    # slack_configs:
    #   - api_url: <SLACK_WEBHOOK_URL>
    #     channel: '#vigilia-alerts'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
