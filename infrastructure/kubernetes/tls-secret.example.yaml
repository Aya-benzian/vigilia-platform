# ─────────────────────────────────────────────────────────────────────────────
# Vigilia Platform — Kubernetes TLS Secret Template (tls-secret.example.yaml)
#
# IMPORTANT: Never commit actual TLS private keys or certificates to Git!
#
# Option A: Generate automatically via our script:
#   ./scripts/generate-dev-tls.sh vigilia
#
# Option B: Create directly via kubectl:
#   kubectl create secret tls vigilia-tls-secret \
#     --cert=tls.crt \
#     --key=tls.key \
#     --namespace=vigilia
#
# Option C: If defining via static manifest:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: vigilia-tls-secret
#   namespace: vigilia
#   labels:
#     app.kubernetes.io/part-of: vigilia-platform
# type: kubernetes.io/tls
# data:
#   tls.crt: <BASE64_ENCODED_CERT>
#   tls.key: <BASE64_ENCODED_KEY>
# ─────────────────────────────────────────────────────────────────────────────

---
# ─────────────────────────────────────────────────────────────────────────────
# Production Automated TLS: cert-manager ClusterIssuer (Let's Encrypt)
# Apply cert-manager first:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: vigilia-platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@vigilia-platform.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx


