# ─────────────────────────────────────────────────────────────────────────────
# Vigilia Platform — Step 22: Kubernetes TLS Secret Template
#
# Contains:
#   1. Manual/Self-Signed TLS Secret (type: kubernetes.io/tls)
#   2. cert-manager ClusterIssuer (for automated Let's Encrypt in production)
#   3. cert-manager Certificate resource
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: vigilia-tls-secret
  namespace: vigilia
  labels:
    app.kubernetes.io/part-of: vigilia-platform
type: kubernetes.io/tls
data:
  # Base64 encoded PEM certificate (full chain)
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  # Base64 encoded PEM private key
  tls.key: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQ...

---
# ─────────────────────────────────────────────────────────────────────────────
# Production Automated TLS: cert-manager ClusterIssuer (Let's Encrypt)
# Apply cert-manager first:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: vigilia-platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@vigilia-platform.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx

