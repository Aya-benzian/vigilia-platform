# ─────────────────────────────────────────────────────────────────────────────
# Vigilia Platform — Kubernetes Secrets Template (secret.example.yaml)
#
# IMPORTANT: Never commit actual production secrets to Git!
# Copy this file to secret.yaml (which is .gitignored) or apply via CLI:
#   kubectl create secret generic vigilia-secrets \
#     --from-literal=POSTGRES_PASSWORD="your-strong-password" \
#     --from-literal=JWT_SECRET="your-256-bit-jwt-secret" \
#     --from-literal=MLFLOW_DB_PASSWORD="your-mlflow-db-password"
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: vigilia-secrets
  labels:
    app.kubernetes.io/part-of: vigilia-platform
type: Opaque
stringData:
  # Database master password
  POSTGRES_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"

  # JWT signing & verification secret (minimum 32 characters / 256 bits)
  JWT_SECRET: "CHANGE_ME_TO_A_SECURE_RANDOM_256_BIT_KEY"

  # MLflow tracking backend database password
  MLFLOW_DB_PASSWORD: "CHANGE_ME_MLFLOW_DB_PASSWORD"
---
# ─────────────────────────────────────────────────────────────────────────────
# Example: Registry Credentials Secret for GitHub Container Registry (GHCR)
#
# To pull private images from GHCR, create the docker-registry secret:
#
# kubectl create secret docker-registry ghcr-secret \
#   --docker-server=ghcr.io \
#   --docker-username=<GITHUB_USERNAME> \
#   --docker-password=<GITHUB_PAT_WITH_READ_PACKAGES> \
#   --docker-email=<YOUR_EMAIL>
# ─────────────────────────────────────────────────────────────────────────────
# Alternatively, if defining via manifest:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: ghcr-secret
#   labels:
#     app.kubernetes.io/part-of: vigilia-platform
# type: kubernetes.io/dockerconfigjson
# data:
#   .dockerconfigjson: <BASE64_ENCODED_DOCKERCONFIGJSON>
