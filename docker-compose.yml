name: vigilia

services:
  postgres:
    image: postgres:16-alpine
    container_name: vigilia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigilia}
      POSTGRES_USER: ${POSTGRES_USER:-vigilia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-mlflow.sh:/docker-entrypoint-initdb.d/init-mlflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilia} -d ${POSTGRES_DB:-vigilia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/observability/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:11.3.2
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus


  ml-serving:
    build:
      context: ./ml/serving
    ports:
      - "${ML_SERVING_PORT:-8000}:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8087}:8080"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_PROMETHEUS_URL=http://localhost:9090
      - VITE_ALERTMANAGER_URL=http://localhost:9093

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CUSTOMER_SERVICE_URL: "http://customer-service:8082"
      TRANSACTION_SERVICE_URL: "http://transaction-service:8083"
      RISK_SERVICE_URL: "http://risk-management-service:8084"
      TRANSACTION_OUTBOX_RELAY_DOWNSTREAM_URL: "http://notification-service:8085/api/v1/notifications"
      NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
      AUTH_JWKS_URL: "http://auth-service:8081/.well-known/jwks.json"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8087,http://127.0.0.1:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=auth
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_with_a_long_random_base64_string}
      NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || curl -sf http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./backend/customer-service
    ports:
      - "${CUSTOMER_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=customer
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: ./backend/transaction-service
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8083}:8083"
    environment:
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=transaction
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      RISK_SERVICE_URL: "http://risk-management-service:8084"
      TRANSACTION_OUTBOX_RELAY_DOWNSTREAM_URL: "http://notification-service:8085/api/v1/notifications"
      VIGILIA_INTERNAL_SERVICE_TOKEN: ${VIGILIA_INTERNAL_SERVICE_TOKEN:-change_me_internal_token}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || curl -sf http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  risk-management-service:
    build:
      context: ./backend/risk-management-service
    ports:
      - "${RISK_SERVICE_PORT:-8084}:8084"
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=risk
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      VIGILIA_INTERNAL_SERVICE_TOKEN: ${VIGILIA_INTERNAL_SERVICE_TOKEN:-change_me_internal_token}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend/notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"
    environment:
      SERVER_PORT: "8085"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=notification
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      CUSTOMER_SERVICE_URL: "http://customer-service:8082"
      BREVO_ENABLED: ${BREVO_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Vigilia Security}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8085/actuator/health || curl -sf http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  audit-service:
    build:
      context: ./backend/audit-service
    ports:
      - "${AUDIT_SERVICE_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8086/actuator/health || curl -sf http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  mlflow:
    build:
      context: ./infrastructure/docker/mlflow
    container_name: vigilia-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_secret}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      - MLFLOW_ARTIFACTS_DESTINATION=/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_secret}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - ./infrastructure/docker/mlflow/register_champions.py:/mlflow/register_champions.py:ro
      - ./infrastructure/docker/mlflow/calibrated_wrapper.py:/mlflow/calibrated_wrapper.py:ro
      - ./ml/training/artifacts:/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db-seed:
    image: postgres:16-alpine
    container_name: vigilia-db-seed
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/seed_customer_synthetic_data.sql:/seed.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigilia}
      POSTGRES_USER: ${POSTGRES_USER:-vigilia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    entrypoint: >
      sh -c "echo 'Checking database state for synthetic seed...' &&
             until PGPASSWORD=$$POSTGRES_PASSWORD psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1;' > /dev/null 2>&1; do
               sleep 2;
             done &&
             echo 'Waiting for microservice schemas to be initialized...' &&
             until PGPASSWORD=$$POSTGRES_PASSWORD psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1 FROM customer.customers LIMIT 1;' > /dev/null 2>&1; do
               sleep 3;
             done &&
             COUNT=$$(PGPASSWORD=$$POSTGRES_PASSWORD psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -t -A -c 'SELECT count(*) FROM customer.customers;' 2>/dev/null || echo 0) &&
             if [ \"$$COUNT\" -ge 50 ]; then
               echo \"Database already initialized with $$COUNT customers. Skipping automatic seed.\";
             else
               echo 'Seeding synthetic customer and transaction dataset...';
               PGPASSWORD=$$POSTGRES_PASSWORD psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -v ON_ERROR_STOP=1 -f /seed.sql &&
               echo 'Synthetic dataset successfully seeded!';
             fi"

volumes:
  postgres_data:
  mlflow_artifacts:

