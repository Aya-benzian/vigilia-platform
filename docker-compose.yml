name: vigilia

services:
  postgres:
    image: postgres:16-alpine
    container_name: vigilia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigilia}
      POSTGRES_USER: ${POSTGRES_USER:-vigilia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-mlflow.sh:/docker-entrypoint-initdb.d/init-mlflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilia} -d ${POSTGRES_DB:-vigilia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/observability/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus


  ml-serving:
    build:
      context: ./ml/serving
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "8087:8080" # Exposed on 8087 locally

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_with_a_long_random_base64_string}
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./backend/customer-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: ./backend/transaction-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    depends_on:
      postgres:
        condition: service_healthy

  risk-management-service:
    build:
      context: ./backend/risk-management-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend/notification-service
    ports:
      - "8085:8085"

  audit-service:
    build:
      context: ./backend/audit-service
    ports:
      - "8086:8086"

  mlflow:
    build:
      context: ./infrastructure/docker/mlflow
    container_name: vigilia-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_secret}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      - MLFLOW_ARTIFACTS_DESTINATION=/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_secret}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  mlflow_artifacts:

