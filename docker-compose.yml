name: vigilia

services:
  postgres:
    image: postgres:16-alpine
    container_name: vigilia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigilia}
      POSTGRES_USER: ${POSTGRES_USER:-vigilia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-mlflow.sh:/docker-entrypoint-initdb.d/init-mlflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilia} -d ${POSTGRES_DB:-vigilia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/observability/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infrastructure/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus


  ml-serving:
    build:
      context: ./ml/serving
    ports:
      - "${ML_SERVING_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8087}:8080"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro

  api-gateway:
    build:
      context: ./backend/api-gateway
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CUSTOMER_SERVICE_URL: "http://customer-service:8082"
      TRANSACTION_SERVICE_URL: "http://transaction-service:8083"
      RISK_SERVICE_URL: "http://risk-management-service:8084"
      AUTH_JWKS_URL: "http://auth-service:8081/.well-known/jwks.json"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:8087,http://127.0.0.1:8087"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./backend/auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=auth
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_with_a_long_random_base64_string}
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./backend/customer-service
    ports:
      - "${CUSTOMER_SERVICE_PORT:-8082}:8082"
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=customer
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: ./backend/transaction-service
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8083}:8083"
    environment:
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=transaction
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    depends_on:
      postgres:
        condition: service_healthy

  risk-management-service:
    build:
      context: ./backend/risk-management-service
    ports:
      - "${RISK_SERVICE_PORT:-8084}:8084"
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vigilia}?currentSchema=risk
      DB_USERNAME: ${POSTGRES_USER:-vigilia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend/notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8085}:8085"

  audit-service:
    build:
      context: ./backend/audit-service
    ports:
      - "${AUDIT_SERVICE_PORT:-8086}:8086"

  mlflow:
    build:
      context: ./infrastructure/docker/mlflow
    container_name: vigilia-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_secret}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      - MLFLOW_ARTIFACTS_DESTINATION=/mlflow/artifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow_secret}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  mlflow_artifacts:

