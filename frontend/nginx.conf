server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # ─── Reverse Proxy to Spring Cloud API Gateway (:8080) ───────────────
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Public JWKS endpoint for token verification ─────────────────────
    location /.well-known/ {
        proxy_pass http://api-gateway:8080/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Spring Boot Actuator health and metrics ─────────────────────────
    location /actuator/ {
        proxy_pass http://api-gateway:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Reverse Proxy to Prometheus (:9090) ─────────────────────────────
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Reverse Proxy to Alertmanager (:9093) ───────────────────────────
    location /alertmanager/ {
        proxy_pass http://alertmanager:9093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Cache static assets aggressively (hashed filenames) ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Disable caching for HTML to guarantee auth revalidation ─────────
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # ─── Kubernetes / Docker Healthcheck ─────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ─── Static files & SPA fallback ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Security headers ────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;

    error_page 404 /index.html;
}
