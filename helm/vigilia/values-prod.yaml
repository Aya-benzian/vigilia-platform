# ─────────────────────────────────────────────────────────────────────────────
# values-prod.yaml — Production Environment Overrides
# Usage: helm install vigilia ./helm/vigilia -f helm/vigilia/values-prod.yaml \
#          --set secrets.postgresPassword=$PROD_DB_PASS \
#          --set secrets.jwtSecret=$PROD_JWT_SECRET \
#          --set secrets.mlflowDbPassword=$PROD_MLFLOW_PASS
# ─────────────────────────────────────────────────────────────────────────────

global:
  imageRegistry: "ghcr.io/vigilia-platform"
  imageTag: "latest"          # pinned to semver tag in real releases e.g. "v1.2.0"
  imagePullPolicy: Always
  imagePullSecret: "ghcr-secret"

namespace: vigilia-prod

config:
  appEnv: "production"
  logLevel: "INFO"
  viteAppEnv: "production"

# ── Prod: multi-replica, full resource limits ─────────────────────────────────

apiGateway:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

authService:
  replicaCount: 2
  resources:
    requests:
      cpu: "200m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

customerService:
  replicaCount: 2
  resources:
    requests:
      cpu: "200m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

transactionService:
  replicaCount: 2
  resources:
    requests:
      cpu: "200m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

riskManagementService:
  replicaCount: 2
  resources:
    requests:
      cpu: "200m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

notificationService:
  replicaCount: 2
  resources:
    requests:
      cpu: "200m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

auditService:
  replicaCount: 2
  resources:
    requests:
      cpu: "200m"
      memory: "384Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

mlServing:
  replicaCount: 2
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1Gi"

frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"

postgres:
  replicaCount: 1          # StatefulSet with replicas handled separately in prod
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ── Prod Ingress: multi-host, strict TLS, rate-limiting annotations ──────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # Production rate limiting (prevent DoS attacks on payment & auth endpoints)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
  hosts:
    - host: "vigilia.platform.internal"
      paths:
        - path: /api
          pathType: Prefix
          serviceName: api-gateway
          servicePort: 8080
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 8080
    - host: "api.vigilia.platform.internal"
      paths:
        - path: /
          pathType: Prefix
          serviceName: api-gateway
          servicePort: 8080
  tls:
    - secretName: "vigilia-prod-tls-secret"
      hosts:
        - "vigilia.platform.internal"
        - "api.vigilia.platform.internal"


