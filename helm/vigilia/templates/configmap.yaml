apiVersion: v1
kind: ConfigMap
metadata:
  name: vigilia-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vigilia-platform
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}

  SPRING_DATASOURCE_URL: {{ .Values.config.springDatasourceUrl | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.config.springDatasourceUsername | quote }}

  AUTH_SERVICE_URL: {{ .Values.config.authServiceUrl | quote }}
  CUSTOMER_SERVICE_URL: {{ .Values.config.customerServiceUrl | quote }}
  TRANSACTION_SERVICE_URL: {{ .Values.config.transactionServiceUrl | quote }}
  RISK_MANAGEMENT_SERVICE_URL: {{ .Values.config.riskManagementServiceUrl | quote }}
  NOTIFICATION_SERVICE_URL: {{ .Values.config.notificationServiceUrl | quote }}
  AUDIT_SERVICE_URL: {{ .Values.config.auditServiceUrl | quote }}
  ML_SERVING_URL: {{ .Values.config.mlServingUrl | quote }}

  VITE_API_BASE_URL: {{ .Values.config.viteApiBaseUrl | quote }}
  VITE_PROMETHEUS_URL: {{ .Values.config.vitePrometheusUrl | quote }}
  VITE_ALERTMANAGER_URL: {{ .Values.config.viteAlertmanagerUrl | quote }}
  VITE_APP_ENV: {{ .Values.config.viteAppEnv | quote }}
  VITE_APP_VERSION: {{ .Values.config.viteAppVersion | quote }}

