{{/*
  deployment-backend.yaml
  All Spring Boot backend microservices:
    auth-service        :8081
    customer-service    :8082
    transaction-service :8083
    risk-management     :8084
    notification        :8085
    audit-service       :8086
*/}}

{{/* ── auth-service ─────────────────────────────────────────────────────── */}}
{{- if .Values.authService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}
  labels:
    app: auth-service
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      containers:
        - name: auth-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.authService.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.authService.port }}
          envFrom:
            - configMapRef:
                name: vigilia-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vigilia-secrets
                  key: JWT_SECRET
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vigilia-secrets
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
{{- end }}

