# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Never commit real secrets.
# In production, use external-secrets, Vault, or sealed-secrets instead.
# For local dev, override via: helm install vigilia ./helm/vigilia \
#   --set secrets.postgresPassword=mypass \
#   --set secrets.jwtSecret=myjwt
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: vigilia-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: vigilia-platform
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  MLFLOW_DB_PASSWORD: {{ .Values.secrets.mlflowDbPassword | quote }}

