server.port=${SERVER_PORT:8082}
spring.application.name=customer-service

# Connexion PostgreSQL via variables d'environnement dédiées (schéma & rôle customer_user)
spring.datasource.url=${CUSTOMER_DB_URL:${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/vigilia?currentSchema=customer}}}
spring.datasource.username=${CUSTOMER_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:vigilia}}}
spring.datasource.password=${CUSTOMER_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:vigilia_secret}}}

# Configuration HikariCP (Connection Pool)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Configuration JPA & schéma par défaut
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=customer

# Flyway : gestion des migrations dans le schéma dédié
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=customer
spring.flyway.default-schema=customer
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

# Actuator : santé et métriques
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Prometheus : tag de service pour les métriques
management.metrics.tags.application=${spring.application.name}
