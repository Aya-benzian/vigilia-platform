server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

# Actuator : santé et métriques
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Prometheus : tag de service pour les métriques
management.metrics.tags.application=${spring.application.name}
