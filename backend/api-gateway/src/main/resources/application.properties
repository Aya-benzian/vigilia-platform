server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

# ==============================================================================
# Spring Cloud Gateway : Définition des Routes
# ==============================================================================

# Route 1: Auth Service (Authentification, jetons, JWKS)
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /.well-known/jwks.json
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=authCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/auth

# Route 2: Customer Service (Profils, bénéficiaires)
spring.cloud.gateway.routes[1].id=customer-service-route
spring.cloud.gateway.routes[1].uri=${CUSTOMER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/customers/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=customerCircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/customer

# Route 3: Transaction Service (Paiements marchands, virements P2P, portefeuilles)
spring.cloud.gateway.routes[2].id=transaction-service-route
spring.cloud.gateway.routes[2].uri=${TRANSACTION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/transactions/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=transactionCircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback/transaction

# Route 4: Risk Management Service (Gestion du risque, revues analystes)
spring.cloud.gateway.routes[3].id=risk-service-route
spring.cloud.gateway.routes[3].uri=${RISK_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/risk/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=riskCircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback/risk

# Route 5: ML Serving — Data Visualization (ANALYST/ADMIN uniquement)
# Réécrit /api/v1/visualization/{family}/{method} → /visualization/{family}/{method} sur ML Serving
spring.cloud.gateway.routes[4].id=ml-visualization-route
spring.cloud.gateway.routes[4].uri=${ML_SERVING_URL:http://ml-serving:8000}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/visualization/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/v1/visualization/(?<segment>.*), /visualization/${segment}
spring.cloud.gateway.routes[4].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[1].args.name=mlVisualizationCircuitBreaker
spring.cloud.gateway.routes[4].filters[1].args.fallbackUri=forward:/fallback/ml-visualization
# Timeout étendu pour les grandes réponses PCA/t-SNE (jusqu'à 2000 points)
spring.cloud.gateway.routes[4].metadata.response-timeout=15000
spring.cloud.gateway.routes[4].metadata.connect-timeout=3000

# ==============================================================================
# Resilience4j Circuit Breaker & TimeLimiter Configuration
# ==============================================================================
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=4s
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.timelimiter.instances.mlVisualizationCircuitBreaker.timeout-duration=15s
resilience4j.circuitbreaker.instances.mlVisualizationCircuitBreaker.slow-call-duration-threshold=12s

# ==============================================================================
# Timeouts Downstream (Contrôle des latences et résilience)
# ==============================================================================
spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=5s

# ==============================================================================
# Configuration CORS Globale
# ==============================================================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8087,http://127.0.0.1:8087}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,X-Correlation-Id,Idempotency-Key,Accept,Origin
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=X-Correlation-Id
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ==============================================================================
# Paramètres JWT & Validation Sécurité
# ==============================================================================
jwt.issuer=${JWT_ISSUER:vigilia-auth}
auth.service.jwks-url=${AUTH_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

# ==============================================================================
# Actuator : santé et métriques
# ==============================================================================
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Prometheus : tag de service pour les métriques
management.metrics.tags.application=${spring.application.name}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==============================================================================
# Structured Logging (logback-spring.xml)
# ==============================================================================
logging.config=classpath:logback-spring.xml
logging.level.com.vigilia=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=WARN
logging.level.io.netty=WARN
logging.level.io.github.resilience4j=INFO

