server.port=${SERVER_PORT:8081}
spring.application.name=auth-service

# Connexion PostgreSQL via variables d'environnement dédiées (schéma & rôle auth_user)
spring.datasource.url=${AUTH_DB_URL:${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/vigilia?currentSchema=auth}}}
spring.datasource.username=${AUTH_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:vigilia}}}
spring.datasource.password=${AUTH_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:vigilia_secret}}}

# Configuration HikariCP (Connection Pool)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Configuration JPA & schéma par défaut
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=auth

# Flyway : gestion des migrations dans le schéma dédié
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

# Actuator : santé et métriques
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Prometheus : tag de service pour les métriques
management.metrics.tags.application=${spring.application.name}

# Sécurité & JWT (auth-service)
jwt.secret=${JWT_SECRET:change_me_with_a_long_random_base64_string}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# Transactional Outbox Relay (Événements de sécurité et intégration Customer)
# ==============================================================================
auth.outbox.relay.enabled=${AUTH_OUTBOX_RELAY_ENABLED:true}
auth.outbox.relay.delay-ms=${AUTH_OUTBOX_RELAY_DELAY_MS:2000}
auth.outbox.relay.max-attempts=${AUTH_OUTBOX_RELAY_MAX_ATTEMPTS:5}
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================================
# Structured Logging (logback-spring.xml)
# ==============================================================================
logging.config=classpath:logback-spring.xml
logging.level.com.vigilia=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO

