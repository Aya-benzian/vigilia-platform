server.port=${SERVER_PORT:8083}
spring.application.name=transaction-service

# Connexion PostgreSQL via variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vigilia}
spring.datasource.username=${DB_USERNAME:vigilia}
spring.datasource.password=${DB_PASSWORD:vigilia_secret}

# Configuration JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway : gestion des migrations de base de données
spring.flyway.enabled=true

# Actuator : santé et métriques
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Prometheus : tag de service pour les métriques
management.metrics.tags.application=${spring.application.name}
