server.port=${SERVER_PORT:8083}
spring.application.name=transaction-service

# Connexion PostgreSQL via variables d'environnement dédiées (schéma & rôle transaction_user)
spring.datasource.url=${TRANSACTION_DB_URL:${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/vigilia?currentSchema=transaction}}}
spring.datasource.username=${TRANSACTION_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:vigilia}}}
spring.datasource.password=${TRANSACTION_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:vigilia_secret}}}

# Configuration HikariCP (Connection Pool)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Configuration JPA & schéma par défaut
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=transaction

# Flyway : gestion des migrations dans le schéma dédié
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=transaction
spring.flyway.default-schema=transaction
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

# Actuator : santé et métriques
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Prometheus : tag de service pour les métriques
management.metrics.tags.application=${spring.application.name}

# Outbox Relay Configuration
transaction.outbox.relay.enabled=${TRANSACTION_OUTBOX_RELAY_ENABLED:true}
transaction.outbox.relay.delay-ms=${TRANSACTION_OUTBOX_RELAY_DELAY_MS:2000}
transaction.outbox.relay.max-attempts=${TRANSACTION_OUTBOX_RELAY_MAX_ATTEMPTS:5}
transaction.outbox.relay.downstream-url=${TRANSACTION_OUTBOX_RELAY_DOWNSTREAM_URL:}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================================
# Structured Logging (logback-spring.xml)
# ==============================================================================
logging.config=classpath:logback-spring.xml
logging.level.com.vigilia=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO

