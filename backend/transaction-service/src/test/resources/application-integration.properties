# ============================================================
# Integration profile — real PostgreSQL via Testcontainers
# Spring Boot auto-configures the DataSource from the
# @DynamicPropertySource set by PostgresIntegrationBase.
# ============================================================

# Let Flyway run against the real PostgreSQL container
spring.flyway.enabled=true
spring.flyway.schemas=transaction
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 dialect override
spring.jpa.properties.hibernate.default_schema=transaction

# Keep outbox relay off and push reconciler schedule out so tests control reconciliation manually
transaction.outbox.relay.enabled=false
transaction.reconciler.enabled=true
transaction.reconciler.delay-ms=86400000

# Risk service — mocked per test via MockBean or WireMock stub
risk.service.url=http://localhost:9998

server.port=0

# Token — required by InternalTransactionController; set to test value
vigilia.internal.service-token=ci-test-internal-token
SPRING_PROFILES_ACTIVE=integration

