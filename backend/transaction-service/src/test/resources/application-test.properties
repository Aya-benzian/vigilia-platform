# ============================================================
# Test Configuration — transaction-service
# Uses H2 in-memory database in PostgreSQL compatibility mode
# ============================================================
spring.datasource.url=jdbc:h2:mem:transaction_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS transaction
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=

# Disable Flyway — H2 schema is generated by Hibernate
spring.flyway.enabled=false

# Disable outbox relay scheduler during tests
transaction.outbox.relay.enabled=false
transaction.outbox.relay.downstream-url=http://localhost:9999/noop

# Risk service URL — mocked in integration tests
risk.service.url=http://localhost:9998

server.port=0
