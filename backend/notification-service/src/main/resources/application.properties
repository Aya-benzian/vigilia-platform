server.port=${SERVER_PORT:8085}
spring.application.name=notification-service

# PostgreSQL connection (dedicated schema: notification)
spring.datasource.url=${NOTIFICATION_DB_URL:${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/vigilia?currentSchema=notification}}}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:vigilia}}}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:vigilia_secret}}}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=notification

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

# Actuator: health & metrics
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=${spring.application.name}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Customer Service & Brevo Email Delivery
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
brevo.enabled=${BREVO_ENABLED:false}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:Vigilia Security}

logging.level.com.vigilia=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
