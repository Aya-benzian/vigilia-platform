# ============================================================
# Test Configuration — risk-management-service
# Uses H2 in-memory database in PostgreSQL compatibility mode
# ============================================================
spring.datasource.url=jdbc:h2:mem:risk_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=

# Disable Flyway — H2 schema is generated by Hibernate
spring.flyway.enabled=false

# Disable outbox relay scheduler during tests
risk.outbox.relay.enabled=false
risk.outbox.relay.downstream-url=http://localhost:9999/noop

# ML service URL — mocked in integration tests
ml.service.url=http://localhost:9997
ml.service.enabled=true
ml.service.timeout-ms=1500

# Customer service URL — mocked in integration tests
customer.service.url=http://localhost:9996

server.port=0
