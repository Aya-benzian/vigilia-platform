server.port=${SERVER_PORT:8084}
spring.application.name=risk-management-service

# Connexion PostgreSQL via variables d'environnement dédiées (schéma & rôle risk_user)
spring.datasource.url=${RISK_DB_URL:${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/vigilia?currentSchema=risk}}}
spring.datasource.username=${RISK_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:vigilia}}}
spring.datasource.password=${RISK_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:vigilia_secret}}}

# Configuration HikariCP (Connection Pool)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Configuration JPA & schéma par défaut
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=risk

# Flyway : gestion des migrations dans le schéma dédié
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=risk
spring.flyway.default-schema=risk
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

# Actuator : santé et métriques
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.livenessstate.enabled=true
management.endpoint.health.readinessstate.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Prometheus : tag de service pour les métriques
management.metrics.tags.application=${spring.application.name}

# ML Serving client configuration
risk.ml.url=${ML_SERVING_URL:http://ml-serving:8000}
risk.ml.timeout-ms=1500
risk.ml.connect-timeout-ms=1000

# Review SLA configuration
risk.review.sla-hours=4

# Pagination defaults for Spring Data Web
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Outbox Relay Configuration
risk.outbox.relay.enabled=${RISK_OUTBOX_RELAY_ENABLED:true}
risk.outbox.relay.delay-ms=${RISK_OUTBOX_RELAY_DELAY_MS:2000}
risk.outbox.relay.max-attempts=${RISK_OUTBOX_RELAY_MAX_ATTEMPTS:5}
vigilia.transaction-service.url=${TRANSACTION_SERVICE_URL:http://localhost:8083}
# Internal Service-to-Service Shared Token sent in X-Internal-Service-Token header
# Set via env var VIGILIA_INTERNAL_SERVICE_TOKEN
vigilia.internal.service-token=${VIGILIA_INTERNAL_SERVICE_TOKEN:}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================================
# Structured Logging (logback-spring.xml)
# ==============================================================================
logging.config=classpath:logback-spring.xml
logging.level.com.vigilia=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO

