# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud — Vigilia Platform
# Organization : aya-benzian  (your GitHub org/user, lowercase)
# Project key  : Aya-benzian_vigilia-platform  (auto-set by SonarCloud on import)
# ─────────────────────────────────────────────────────────────────────────────

sonar.projectKey=Aya-benzian_vigilia-platform
sonar.organization=aya-benzian
sonar.projectName=Vigilia Platform
sonar.projectVersion=0.0.1-SNAPSHOT

# ── Sources ──────────────────────────────────────────────────────────────────
sonar.sources=backend,ml,frontend
sonar.tests=backend,ml/training/tests

# ── Exclusions ───────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.class,\
  **/dist/**,\
  **/.venv/**,\
  **/wheels/**,\
  **/data/**,\
  **/notebooks/**,\
  **/reports/**,\
  ml/training/src/pipeline.py,\
  ml/training/src/export_artifacts.py,\
  ml/training/src/benchmark_ulb.py,\
  ml/training/src/cost_review.py

sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/test_*.py,**/*_test.py

# ── Coverage exclusions (CLI pipelines / live data scripts) ──────────────────
sonar.coverage.exclusions=\
  ml/training/src/pipeline.py,\
  ml/training/src/register.py,\
  ml/training/src/evaluate.py,\
  ml/training/src/tune.py,\
  ml/training/src/cv_compare.py,\
  ml/training/src/stats_tests.py,\
  ml/training/src/calibrate.py,\
  ml/training/src/export_artifacts.py,\
  ml/training/src/benchmark_ulb.py,\
  ml/training/src/cost_review.py,\
  ml/training/src/data_io.py,\
  ml/training/src/models.py,\
  ml/training/src/baselines.py,\
  ml/training/src/config.py

# ── Java ─────────────────────────────────────────────────────────────────────
# Points to the JARs downloaded from the backend CI artifacts
sonar.java.binaries=sonar-binaries
sonar.java.source=21

# ── Python ───────────────────────────────────────────────────────────────────
sonar.python.version=3.12
sonar.python.coverage.reportPaths=ml/training/coverage.xml,ml/serving/coverage.xml

# ── Quality Gate ─────────────────────────────────────────────────────────────
# Block the pipeline until the gate result is returned
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
