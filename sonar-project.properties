# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud — Vigilia Platform
# Organization : aya-benzian  (your GitHub org/user, lowercase)
# Project key  : Aya-benzian_vigilia-platform  (auto-set by SonarCloud on import)
# ─────────────────────────────────────────────────────────────────────────────

sonar.projectKey=Aya-benzian_vigilia-platform
sonar.organization=aya-benzian
sonar.projectName=Vigilia Platform
sonar.projectVersion=0.0.1-SNAPSHOT

# ── Sources ──────────────────────────────────────────────────────────────────
sonar.sources=backend,ml,frontend
sonar.tests=backend

# ── Exclusions ───────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/target/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.class,\
  **/dist/**,\
  **/.venv/**,\
  **/wheels/**

sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/test_*.py,**/*_test.py

# ── Java ─────────────────────────────────────────────────────────────────────
# Points to the JARs downloaded from the backend CI artifacts
sonar.java.binaries=sonar-binaries
sonar.java.source=21

# ── Python ───────────────────────────────────────────────────────────────────
sonar.python.version=3.12

# ── Quality Gate ─────────────────────────────────────────────────────────────
# Block the pipeline until the gate result is returned
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
