services:
  postgres:
    environment:
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD}
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD}
    volumes:
      - ./infrastructure/docker/postgres/01-init-schemas.sh:/docker-entrypoint-initdb.d/01-init-schemas.sh:ro
