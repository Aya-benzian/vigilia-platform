# ─────────────────────────────────────────────────────────────────────────────
# Vigilia Platform — Security Scanning (Trivy)
#
# Jobs:
#   gitleaks      → secret scan (no leaked credentials)
#   trivy-fs      → scan repo filesystem & dependencies for CVEs
#   trivy-config  → scan IaC files for misconfigurations
#                   (Dockerfiles, docker-compose.yml, K8s manifests)
#
# Trivy findings are printed to the Action log in every run.
# SARIF upload to the Security tab is best-effort (continue-on-error: true)
# because it requires GitHub Advanced Security or Code Scanning to be enabled
# in the repository settings — activation is a one-time manual step.
# ─────────────────────────────────────────────────────────────────────────────

name: Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
      - "workspace/**"
  push:
    branches:
      - main
      - develop

concurrency:
  group: security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least-privilege baseline for all jobs in this workflow.
# • contents: read        — required by actions/checkout
# • pull-requests: read   — required by gitleaks-action@v2 to list PR commits via
#                            GET /repos/{owner}/{repo}/pulls/{pull_number}/commits
#                            Without this the API returns 403 and the scan fails
#                            before it can even inspect a single file.
# • security-events: write — required by github/codeql-action/upload-sarif@v4
#                            to post Trivy SARIF reports to the Security tab.
#                            Upload is best-effort (continue-on-error: true) —
#                            it needs Code Scanning enabled in repo Settings.
permissions:
  contents: read
  pull-requests: read
  security-events: write

# ─────────────────────────────────────────────────────────────────────────────
# JOB 0 — Gitleaks secret scan
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  gitleaks:
    name: "Gitleaks — secret scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # uncomment for private repos

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Filesystem & dependency CVE scan
# Scans requirements.txt, package.json, pom.xml for known vulnerabilities
# ─────────────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: "Trivy — dependency & filesystem CVE scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # skip CVEs with no fix available yet
          trivyignores: .trivyignore

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        # Run even if Trivy found issues so the report always lands in Security tab
        if: always()
        # best-effort: requires Code Scanning to be enabled in repo Settings →
        # Security & analysis → Code scanning. Without it the upload returns 403
        # but the scan above has already completed successfully.
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — IaC & configuration misconfiguration scan
# Scans: Dockerfiles, docker-compose.yml, and K8s/Helm manifests (when added)
# ─────────────────────────────────────────────────────────────────────────────
  trivy-config:
    name: "Trivy — IaC & Dockerfile misconfiguration scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          # Paths scanned automatically: all Dockerfiles, docker-compose.yml,
          # and K8s manifests under infrastructure/kubernetes/

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        # best-effort: requires Code Scanning to be enabled in repo Settings →
        # Security & analysis → Code scanning. Without it the upload returns 403
        # but the scan above has already completed successfully.
        continue-on-error: true
        with:
          sarif_file: trivy-config.sarif
          category: trivy-iac
