# ─────────────────────────────────────────────────────────────────────────────
# Vigilia Platform — CI Pipeline
# Triggered on every Pull Request against: main, develop, workspace/*
#
# Pipeline (sequential gates):
#   gitleaks      → secret scan (blocks everything if secrets found)
#   backend       → Maven test + package (7 Spring Boot services)
#   ml-serving    → pip install + pytest (FastAPI serving)
#   ml-training   → pip install + pytest (ML training workspace)
#   frontend      → npm install + build
#   sonar         → SonarCloud quality gate
#   docker-build  → Build + Trivy image scan (matrix, cached via GHCR)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "workspace/**"

# Cancel in-flight runs on the same PR branch when a new push arrives
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Backend (7 Spring Boot services via Maven)
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# JOB 0 — Gitleaks secret scan (first gate — blocks all other jobs)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  gitleaks:
    name: "Gitleaks — secret scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history to catch secrets in all commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # uncomment for private repos

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Backend (7 Spring Boot services via Maven)
# ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: "Backend — Maven test & package"
    runs-on: ubuntu-latest
    needs: [gitleaks]

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - customer-service
          - transaction-service
          - risk-management-service
          - notification-service
          - audit-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: backend/${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress test

      - name: Package (skip tests — already ran above)
        working-directory: backend/${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: backend/${{ matrix.service }}/target/*.jar
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — ML Serving (FastAPI / Python 3.12)
# ─────────────────────────────────────────────────────────────────────────────
  ml-serving:
    name: "ML Serving — pip install & test"
    runs-on: ubuntu-latest
    needs: [gitleaks]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/serving/requirements.txt

      - name: Install dependencies
        working-directory: ml/serving
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        working-directory: ml/serving
        # Discovers tests under ml/serving/tests/ or exits 0 if none yet
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            python -m pytest -v --tb=short
          else
            echo "No tests found yet — skipping (will fail once tests are added)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — ML Training (Python 3.12)
# ─────────────────────────────────────────────────────────────────────────────
  ml-training:
    name: "ML Training — pip install & test"
    runs-on: ubuntu-latest
    needs: [gitleaks]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/training/requirements.txt

      - name: Install dependencies
        working-directory: ml/training
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        working-directory: ml/training
        run: |
          if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            python -m pytest -v --tb=short
          else
            echo "No tests found yet — skipping (will fail once tests are added)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Frontend (Node / npm)
# ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend — npm install & build"
    runs-on: ubuntu-latest
    needs: [gitleaks]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache: npm — skipped until frontend/package-lock.json exists (M4 will add it)

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        working-directory: frontend
        run: npm run build

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — SonarCloud analysis + Quality Gate
# Fans in after all test jobs; blocks docker-build if gate fails
# ─────────────────────────────────────────────────────────────────────────────
  sonar:
    name: "SonarCloud — Quality Gate"
    runs-on: ubuntu-latest
    needs: [backend, ml-serving, ml-training, frontend]
    # Skip Sonar on Dependabot PRs because secrets (SONAR_TOKEN) are not injected by default
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout (full history for blame & SCM info)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all backend JAR artifacts
        uses: actions/download-artifact@v4
        with:
          # Pattern matches all <service>-jar artifacts uploaded by the backend job
          pattern: "*-jar"
          path: sonar-binaries
          merge-multiple: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # PR decoration & status checks
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}      # Add in repo Settings → Secrets

# ─────────────────────────────────────────────────────────────────────────────
# JOB 6 — Docker image builds (matrix, fans in after quality gate passes)
# ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker — build ${{ matrix.image.name }}"
    runs-on: ubuntu-latest
    needs: [backend, ml-serving, ml-training, frontend, sonar]
    # Run if all tests passed and Sonar either passed or was skipped (e.g. on Dependabot PRs)
    if: always() && needs.backend.result == 'success' && needs.ml-serving.result == 'success' && needs.ml-training.result == 'success' && needs.frontend.result == 'success' && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api-gateway
            context: backend/api-gateway
          - name: auth-service
            context: backend/auth-service
          - name: customer-service
            context: backend/customer-service
          - name: transaction-service
            context: backend/transaction-service
          - name: risk-management-service
            context: backend/risk-management-service
          - name: notification-service
            context: backend/notification-service
          - name: audit-service
            context: backend/audit-service
          - name: ml-serving
            context: ml/serving
          - name: ml-training
            context: ml/training
          - name: frontend
            context: frontend
          - name: mlflow
            context: infrastructure/docker/mlflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image prefix
        id: image_prefix
        run: echo "value=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/vigilia" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_prefix.outputs.value }}-${{ matrix.image.name }}
          tags: |
            type=sha,prefix=pr-${{ github.event.number }}-,format=short

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: false
          load: true          # load into local daemon so Trivy can scan it
          tags: |
            ${{ steps.meta.outputs.tags }}
            vigilia-local/${{ matrix.image.name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image_prefix.outputs.value }}-${{ matrix.image.name }}:cache
          cache-to: type=registry,ref=${{ steps.image_prefix.outputs.value }}-${{ matrix.image.name }}:cache,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vigilia-local/${{ matrix.image.name }}:scan
          format: table          # human-readable output in the Actions log
          exit-code: 0           # audit mode: report CVEs without blocking build
          ignore-unfixed: true   # skip CVEs with no available fix
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: CRITICAL,HIGH

# ─────────────────────────────────────────────────────────────────────────────
# JOB 7 — CI Gate (unified single status check for GitHub branch protection)
# ─────────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: "CI Gate — All Checks"
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: always()
    steps:
      - name: Verify pipeline status
        run: |
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "CI pipeline failed! Downstream builds or tests were unsuccessful."
            exit 1
          fi
          echo "All pipeline gates passed successfully! ✅"
