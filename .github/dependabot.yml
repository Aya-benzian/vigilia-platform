  # ── pip — ML services ───────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /ml/serving
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - ml-serving
    groups:
      ml-serving-dependencies:
        patterns:
          - "*"
    ignore:
      # Ignore version bumps to preserve M1's pickled model compatibility,
      # but allow security updates (CVEs) to pass through for review (NFR-09).
      - dependency-name: "scikit-learn"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "xgboost"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "joblib"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: pip
    directory: /ml/training
