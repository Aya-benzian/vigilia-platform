# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — Vigilia Platform
#
# Policy: Minimize noise, not protection
#
# • Schedule: Weekly on Monday at 06:00 UTC (run weekly, not daily)
# • PR Cap: Max 5 open PRs per ecosystem/directory (capped at 3-5)
# • Grouping: All updates in a folder are grouped into a single PR (patterns: ["*"])
# • ML Pinned Libraries: Routine version bumps for scikit-learn, xgboost, numpy,
#   pandas, and joblib are ignored to protect M1's pickled model compatibility.
# • Security Updates: Fully enabled for all folders, including ML (supports NFR-09).
# • GitHub Actions: Kept active and grouped to resolve Node.js deprecation warnings.
# • Review Policy: No auto-merge; manual review required; merge blocked if CI is red.
# ─────────────────────────────────────────────────────────────────────────────

version: 2

updates:

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # ── Maven — Backend services ────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /backend/api-gateway
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
      - backend
    groups:
      api-gateway-dependencies:
        patterns:
          - "*"

