# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — Vigilia Platform
#
# Ecosystems covered:
#   github-actions  → workflow action versions
#   maven           → 7 Spring Boot services
#   pip             → ml/serving, ml/training
#   npm             → frontend
#   docker          → 11 Dockerfiles (base image updates)
#
# Schedule: weekly on Monday at 06:00 UTC
# Groups:   minor + patch updates are bundled into a single PR per ecosystem
#           to reduce noise. Security updates always get their own PR.
# ─────────────────────────────────────────────────────────────────────────────

version: 2

updates:

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # ── Maven — Backend services ────────────────────────────────────────────────
